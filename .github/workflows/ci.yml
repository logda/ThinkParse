name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

# All commands live in the Makefile; this workflow only dispatches targets,
# so local `make ci` and CI run exactly the same checks.

jobs:
  test:
    name: Control plane tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r control/requirements-dev.txt

      - name: Lint and test
        run: make lint test

  docker-build:
    name: Control plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        run: make docker-build-control CONTROL_IMAGE=thinkparse-control:test

  mcp-test:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Lint and test
        run: make lint-mcp test-mcp

  mcp-docker-build:
    name: MCP server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image
        run: make docker-build-mcp MCP_IMAGE=thinkparse-mcp:test
