[project]
name = "thinkparse-mcp"
version = "0.1.0"
description = "MCP server wrapping the ThinkParse /api/v2 document parsing service"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkparse_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests gated by MCP_IT=1 (or --run-integration)",
]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep the same lint surface as the root ThinkParse project.
select = ["E4", "E7", "E9", "F"]
